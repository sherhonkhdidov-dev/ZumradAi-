<!doctype html>
<html lang="uz" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zumrad AI</title>
<meta name="description" content="Zumrad AI — o‘zbek tilidagi sun’iy intellekt: suhbat, kod, rasm va video.">
<meta name="theme-color" content="#F3F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;500&family=Onest:wght@400..700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Mavzuni sahifa chizilishidan oldin qo‘llaymiz (miltillashning oldini olish)
  try { var s = JSON.parse(localStorage.getItem('zumrad.settings') || '{}'); if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="m3.5 17 5-4.5 4 3.5 3-2.5 5 4.5"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="14" height="13" rx="3"/><path d="m16.5 10.5 5-3v9l-5-3"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4.5 4L8 16M16 8l4.5 4L16 16M13.5 5.5l-3 13"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5h10L18 7M9 7V4.5h6V7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 20 4-1L19.5 7.5l-3-3L5 16z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.2M20 4v7h-7"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="i-zip" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="1.5"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5.5 12.5 12 19l6.5-6.5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.4 6.4L21 6.5l-3 5.5 3 5.5-6.6-1.9L12 22l-2.4-6.4L3 17.5 6 12 3 6.5l6.6 1.9z" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-side="closed" data-panel="closed">

  <!-- ============ Chap panel: suhbatlar ============ -->
  <aside class="side" id="side" aria-label="Suhbatlar">
    <div class="side-head">
      <a class="brand" href="/" aria-label="Zumrad AI">
        <img src="icons/logo.svg" alt="" width="30" height="30">
        <span>Zumrad&nbsp;AI</span>
      </a>
      <button class="icon-btn side-close" id="sideClose" aria-label="Yopish"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button class="new-chat" id="newChat"><svg class="ic"><use href="#i-plus"/></svg><span>Yangi suhbat</span></button>
    <nav class="history" id="history" aria-label="Suhbatlar tarixi"></nav>
    <div class="side-foot">
      <button class="side-link" id="openSettings"><svg class="ic"><use href="#i-sliders"/></svg><span>Sozlamalar</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Mavzuni almashtirish"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ Markaz: chat ============ -->
  <main class="main" id="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menyu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <h1 class="top-title" id="topTitle">Yangi suhbat</h1>
      <span class="model-badge" id="modelBadge" hidden></span>
      <button class="icon-btn" id="exportBtn" aria-label="Suhbatni yuklab olish" title="Suhbatni .md qilib yuklab olish"><svg class="ic"><use href="#i-download"/></svg></button>
    </header>

    <div class="chat-scroll" id="scroll">
      <div class="chat-col" id="chat"></div>
    </div>
    <button class="to-bottom" id="toBottom" aria-label="Pastga" hidden><svg class="ic"><use href="#i-down"/></svg></button>

    <div class="composer-wrap" id="composerWrap">
      <form class="composer" id="composer" autocomplete="off">
        <div class="attached" id="attached" hidden></div>
        <textarea id="prompt" rows="1" placeholder="Zumrad AI’ga yozing…" aria-label="Xabar"></textarea>
        <div class="composer-row">
          <button type="button" class="icon-btn" id="attachBtn" aria-label="Fayl biriktirish" title="Fayl yoki rasm biriktirish"><svg class="ic"><use href="#i-clip"/></svg></button>
          <div class="modes" id="modes" role="radiogroup" aria-label="Rejim">
            <button type="button" role="radio" data-mode="auto" aria-checked="true">Avto</button>
            <button type="button" role="radio" data-mode="chat" aria-checked="false"><svg class="ic sm"><use href="#i-chat"/></svg>Suhbat</button>
            <button type="button" role="radio" data-mode="image" aria-checked="false"><svg class="ic sm"><use href="#i-image"/></svg>Rasm</button>
            <button type="button" role="radio" data-mode="video" aria-checked="false"><svg class="ic sm"><use href="#i-film"/></svg>Video</button>
          </div>
          <button type="button" class="icon-btn" id="webBtn" aria-pressed="false" aria-label="Internetdan qidirish" title="Internetdan qidirish: avto"><svg class="ic"><use href="#i-globe"/></svg></button>
          <button type="submit" class="send" id="sendBtn" aria-label="Yuborish"><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
        <div class="mode-options" id="modeOptions" hidden></div>
      </form>
      <p class="fine">Zumrad AI xato qilishi mumkin — muhim ma’lumotni tekshiring.</p>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </main>

  <!-- ============ O'ng panel: jonli ko'rinish ============ -->
  <aside class="panel" id="panel" aria-label="Jonli ko‘rinish">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabPreview" aria-selected="true"><svg class="ic sm"><use href="#i-eye"/></svg>Ko‘rinish</button>
        <button role="tab" id="tabCode" aria-selected="false"><svg class="ic sm"><use href="#i-code"/></svg>Kod</button>
      </div>
      <div class="devices" id="devices" role="radiogroup" aria-label="Ekran o‘lchami">
        <button role="radio" data-w="390" aria-checked="false" aria-label="Telefon"><svg class="ic"><use href="#i-phone"/></svg></button>
        <button role="radio" data-w="820" aria-checked="false" aria-label="Planshet"><svg class="ic"><use href="#i-tablet"/></svg></button>
        <button role="radio" data-w="0" aria-checked="true" aria-label="Kompyuter"><svg class="ic"><use href="#i-monitor"/></svg></button>
      </div>
      <button class="icon-btn" id="panelReload" aria-label="Qayta yuklash" title="Qayta yuklash"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="panelOpen" aria-label="Yuklab olish" title="Yuklab olish"><svg class="ic"><use href="#i-download"/></svg></button>
      <button class="icon-btn" id="panelClose" aria-label="Yopish"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body">
      <div class="stage" id="stage"><iframe id="frame" title="Jonli ko‘rinish" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></div>
      <div class="files" id="files" hidden></div>
    </div>
  </aside>
</div>

<!-- ============ Sozlamalar ============ -->
<dialog id="settings" class="dialog" aria-labelledby="settingsTitle">
  <form method="dialog" class="dialog-head">
    <h2 id="settingsTitle">Sozlamalar</h2>
    <button class="icon-btn" aria-label="Yopish"><svg class="ic"><use href="#i-x"/></svg></button>
  </form>
  <div class="dialog-body" id="settingsBody"></div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/jszip.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
