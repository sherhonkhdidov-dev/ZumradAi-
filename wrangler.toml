name = "zumradai"
main = "worker/index.js"
compatibility_date = "2025-10-01"

# Cloudflare Workers AI — bepul zaxira miya (kunlik bepul limit bor).
[ai]
binding = "AI"

# Workers AI — chat, rasm va video ssenariysi uchun (nomi aynan "AI" bo‘lishi shart).
[ai]
binding = "AI"

# web/ papkasi — sayt (frontend). /api/* so‘rovlari avval Worker’ga boradi.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# IXTIYORIY sozlamalar. Maxfiy kalitlarni [vars] ga YOZMANG — Cloudflare
# Dashboard → Workers → zumrad-ai → Settings → Variables and Secrets orqali qo‘shing.
#
#   ACCESS_CODE            — saytga kirish kodi (kvotangizni begonalardan himoya qiladi)
#   TAVILY_API_KEY         — sifatli internet qidiruvi (tavily.com, bepul reja bor)
#   BRAVE_API_KEY          — muqobil qidiruv (Brave Search API)
#   OWN_MODEL_URL         — o‘zingizning Zumrad matn modeli serveri (masalan Render URL)
#   OWN_MODEL_TOKEN       — ixtiyoriy server tokeni; serverdagi OWN_MODEL_TOKEN bilan bir xil
#   OWN_IMAGE_URL         — faqat o‘zingizning rasm modelingiz API manzili
#   OWN_IMAGE_TOKEN       — ixtiyoriy rasm serveri tokeni
#   OWN_VIDEO_URL         — kelajakdagi o‘z video modelingiz API manzili
# ---------------------------------------------------------------------------
